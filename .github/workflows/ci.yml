name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run design-check
      - run: npm run contrast-check
      - run: npm run verify-scales
      - run: npm run registry:build
      - run: git diff --exit-code -- registry.json public/r
      - run: npm run build
